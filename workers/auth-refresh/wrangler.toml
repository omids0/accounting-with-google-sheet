name = "accounting-auth-refresh"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
# Origins (comma separated, scheme + host + port, no path) allowed to call the worker.
# The dev site under /dev/ shares the GitHub Pages origin, so one entry covers both.
ALLOWED_ORIGINS = "http://localhost:5173,https://omids0.github.io"

# Create the namespace with `npx wrangler kv namespace create AUTH_KV`
# and paste the printed id here before deploying.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "129d48daef3b47d4964f963208105799"
