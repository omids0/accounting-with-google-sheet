<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy. script-src hashes cover, in order: the theme
      script below (LF line endings, as built in CI), the same script with CRLF
      endings (local Windows builds), and vite-plugin-pwa's dev-only SW register
      script. Editing the theme script changes its hash: recompute both
      variants or it is blocked (only the pre-paint dark theme is lost).
      Vite's react-refresh preamble in dev is injected above this tag, so the
      policy does not apply to it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-hBnJUCQYdTeCltSX8mFZhxPxYwzCvl9flehjmg/D+eg=' 'sha256-+ojSL6M8TYUhhVh3VY2v6S9dCk/OobJ+Zc4Fix4tlAE=' 'sha256-/AO8vAagk08SqUGxY96ci/dGyTDsuoetPOJYMn7sc+E=' https://accounts.google.com/gsi/client https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com/gsi/style; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.googleusercontent.com https://tile.openstreetmap.org; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://call5.tgju.org https://nominatim.openstreetmap.org; frame-src https://accounts.google.com/gsi/ https://docs.google.com https://drive.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-FD-font-face.css"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="نرم‌افزار حسابداری شخصی با ذخیره‌سازی در گوگل شیت" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حسابداری" />
    <title>حسابداری شخصی</title>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('accounting_settings')
          if (!raw) return
          var settings = JSON.parse(raw)
          if (settings.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
