<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy. script-src hashes cover, in order: the theme and display
      script below (LF line endings, as built in CI), the same script with CRLF
      endings (local Windows builds), and vite-plugin-pwa's dev-only SW register
      script. Editing the theme script changes its hash: recompute both
      variants or it is blocked (only the pre-paint dark theme is lost).
      Vite's react-refresh preamble in dev is injected above this tag, so the
      policy does not apply to it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-KVQe2+VP/IoD3BT+bDtrDcN5MdejWwy8YKzUsOD2fak=' 'sha256-uGcX2Ayw//PjYxg6jj0ZCYORF0CS/VswjZiT1ZQmP1U=' 'sha256-/AO8vAagk08SqUGxY96ci/dGyTDsuoetPOJYMn7sc+E=' https://accounts.google.com/gsi/client https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data: blob: https://*.googleusercontent.com https://tile.openstreetmap.org; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://call5.tgju.org https://nominatim.openstreetmap.org; frame-src https://accounts.google.com/gsi/ https://docs.google.com https://drive.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Self-hosted Vazirmatn text face (src/styles/fonts.css); Vite rewrites the hashed URL. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/vazirmatn/fonts/webfonts/Vazirmatn[wght].woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="حساب کتاب: حسابداری شخصی با ذخیره‌سازی در گوگل شیت" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حساب کتاب" />
    <title>حساب کتاب</title>
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var store = window.localStorage
          var raw = store.getItem('accounting_settings')
          var theme = raw ? JSON.parse(raw).theme : null
          var media = function (query) {
            return !!window.matchMedia && window.matchMedia(query).matches
          }
          if (theme === 'dark' || (theme === 'system' && media('(prefers-color-scheme: dark)'))) {
            root.setAttribute('data-theme', 'dark')
            root.style.colorScheme = 'dark'
          }
          var size = store.getItem('accounting_text_size')
          if (size === 'sm' || size === 'lg' || size === 'xl')
            root.setAttribute('data-text-size', size)
          if (
            store.getItem('accounting_reduced_motion') === '1' ||
            media('(prefers-reduced-motion: reduce)')
          ) {
            root.setAttribute('data-reduced-motion', 'reduce')
          }
          if (store.getItem('accounting_high_contrast') === '1')
            root.setAttribute('data-contrast', 'high')
          if (store.getItem('accounting_latin_digits') === '1')
            root.setAttribute('data-digits', 'latn')
        } catch (e) {}
      })()
    </script>
    <style>
      .boot-splash {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: linear-gradient(160deg, #f0fdfa 0%, #ccfbf1 50%, #99f6e4 100%);
        font-family: Vazirmatn, Tahoma, sans-serif;
      }
      [data-theme='dark'] .boot-splash {
        background: linear-gradient(160deg, #0a0a09 0%, #141412 50%, #1f1b14 100%);
      }
      .boot-logo {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        box-shadow: 0 10px 28px rgba(15, 118, 110, 0.25);
      }
      .boot-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
        color: #0d5d57;
      }
      [data-theme='dark'] .boot-title {
        color: #e8c57a;
      }
      .boot-dots {
        display: flex;
        gap: 0.375rem;
      }
      .boot-dots span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #0f766e;
        animation: boot-blink 1.2s ease-in-out infinite;
      }
      [data-theme='dark'] .boot-dots span {
        background: #c99a3f;
      }
      .boot-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .boot-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes boot-blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dots span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Painted before any JS; React's first render replaces it with the same markup (AppLoadingSkeleton). -->
      <div class="boot-splash" aria-busy="true" aria-label="در حال بارگذاری">
        <svg class="boot-logo" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="22" fill="#0f766e" />
          <path d="M22 72V28M22 72h56" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
          <rect x="30" y="48" width="8" height="24" rx="2" fill="#fff" />
          <rect x="42" y="36" width="8" height="36" rx="2" fill="#fff" />
          <rect x="54" y="52" width="8" height="20" rx="2" fill="#fff" />
        </svg>
        <p class="boot-title">حساب کتاب</p>
        <div class="boot-dots" role="status"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
