name: Build Android APK

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # develop builds are labelled «dev» and install beside production: another
      # application id, app name and file name. main publishes a release; develop
      # replaces the rolling pre-release «dev-latest», which only the dev APK reads.
      VITE_APP_ENV: ${{ github.ref_name == 'develop' && 'dev' || '' }}
      APP_ID_SUFFIX: ${{ github.ref_name == 'develop' && '.dev' || '' }}
      APK_FILE: ${{ github.ref_name == 'develop' && 'hesab-ketab-dev.apk' || 'hesab-ketab.apk' }}
      # Links of the invitation e-mail, the same as the web build of this branch (deploy.yml).
      VITE_APP_URL: ${{ github.ref_name == 'develop' && 'https://omids0.github.io/accounting-with-google-sheet/dev/' || 'https://omids0.github.io/accounting-with-google-sheet/' }}
      VITE_APP_DOWNLOAD_URL: ${{ github.ref_name == 'develop' && 'https://github.com/omids0/accounting-with-google-sheet/releases/download/dev-latest/hesab-ketab-dev.apk' || 'https://github.com/omids0/accounting-with-google-sheet/releases/latest/download/hesab-ketab.apk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the pinned debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."
            echo "Google matches the APK's signing certificate against the Android OAuth"
            echo "client, so every build has to use the same key. Add the secret, then re-run."
            exit 1
          fi
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > android/debug.keystore

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npx cap sync android

      - name: Verify Google client ID reached the Android config
        run: |
          node -e "
            const cfg = require('./android/app/src/main/assets/capacitor.config.json');
            const id = cfg.plugins?.GoogleAuth?.clientId ?? '';
            if (!id.endsWith('.apps.googleusercontent.com')) {
              console.error('GoogleAuth clientId is missing or invalid (value length: ' + id.length + ').');
              console.error('Set the VITE_GOOGLE_CLIENT_ID repository secret to the Web OAuth client ID.');
              process.exit(1);
            }
            console.log('GoogleAuth clientId present, project prefix: ' + id.split('-')[0]);
          "

      - name: Name the app «dev» on the launcher
        if: env.VITE_APP_ENV == 'dev'
        run: |
          sed -i \
            -e '/name="app_name"/s|حساب کتاب|حساب کتاب (dev)|' \
            -e '/name="title_activity_main"/s|حساب کتاب|حساب کتاب (dev)|' \
            android/app/src/main/res/values/strings.xml
          grep -E 'app_name|title_activity_main' android/app/src/main/res/values/strings.xml
          # Long-press shortcuts name the package they open; it must be the dev app.
          sed -i 's|targetPackage="com.omids0.accounting"|targetPackage="com.omids0.accounting.dev"|' \
            android/app/src/main/res/xml/shortcuts.xml
          grep -c 'targetPackage="com.omids0.accounting.dev"' android/app/src/main/res/xml/shortcuts.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          [ "$VITE_APP_ENV" = "dev" ] && VERSION_NAME="$VERSION_NAME-dev"
          cd android && ./gradlew assembleDebug --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="$VERSION_NAME" \
            -PappIdSuffix="$APP_ID_SUFFIX" \
            -PapkFileName="$APK_FILE"

      - name: Verify the APK's signing certificate
        env:
          # Registered on the Android OAuth client in Google Cloud Console.
          EXPECTED_SHA1: 3b63741fece7cdb990a363699a5eaf943ee1f005
        run: |
          APK=android/app/build/outputs/apk/debug/$APK_FILE
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}')
          echo "APK certificate SHA-1: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA1" ]; then
            echo "Expected:              $EXPECTED_SHA1"
            echo "The APK is signed with a different key than the one registered in Google"
            echo "Cloud Console, so sign-in would fail with DEVELOPER_ERROR (10)."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'develop' && 'hesab-ketab-dev-apk' || 'hesab-ketab-apk' }}
          path: android/app/build/outputs/apk/debug/${{ env.APK_FILE }}

      # The app checks version.json to decide whether to offer an update, and release
      # assets (unlike workflow artifacts) are downloadable without a GitHub account.
      - name: Publish the APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          TAG="android-v${{ github.run_number }}"
          # The in-app update downloads the versioned file, so the saved name carries the
          # version. The unversioned copy keeps the web build's fixed «latest» link working.
          VERSIONED="hesab_ketab_v${VERSION_NAME}.apk"
          cat > version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$VERSIONED"
          }
          EOF
          cp android/app/build/outputs/apk/debug/hesab-ketab.apk "$VERSIONED"
          APK=android/app/build/outputs/apk/debug/hesab-ketab.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$VERSIONED" version.json --clobber
          else
            gh release create "$TAG" "$APK" "$VERSIONED" version.json \
              --title "$VERSION_NAME (build ${{ github.run_number }})" \
              --notes "Android build ${{ github.run_number }} from ${{ github.sha }}"
          fi

      # Same job as the step above for the develop APK: it checks this manifest, so it offers
      # an update exactly like production does. A pre-release is never the repository's
      # «latest» release, so production users (who read releases/latest) never see it. The
      # release is replaced as a whole, so old dev APKs do not pile up.
      - name: Publish the dev APK as the rolling «dev-latest» pre-release
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")-dev"
          TAG="dev-latest"
          VERSIONED="hesab_ketab_dev_v${VERSION_NAME}_b${{ github.run_number }}.apk"
          cat > version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$VERSIONED"
          }
          EOF
          APK=android/app/build/outputs/apk/debug/$APK_FILE
          cp "$APK" "$VERSIONED"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" "$VERSIONED" version.json \
            --prerelease --target "${{ github.sha }}" \
            --title "$VERSION_NAME (build ${{ github.run_number }})" \
            --notes "Develop Android build ${{ github.run_number }} from ${{ github.sha }}. Replaced by the next develop build."
