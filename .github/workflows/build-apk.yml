name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore debug keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print debug keystore SHA1
        run: |
          echo "Register this SHA1 once as an Android OAuth client in Google Cloud Console:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep SHA1

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npx cap sync android

      - name: Verify Google client ID reached the Android config
        run: |
          node -e "
            const cfg = require('./android/app/src/main/assets/capacitor.config.json');
            const id = cfg.plugins?.GoogleAuth?.clientId ?? '';
            if (!id.endsWith('.apps.googleusercontent.com')) {
              console.error('GoogleAuth clientId is missing or invalid (value length: ' + id.length + ').');
              console.error('Set the VITE_GOOGLE_CLIENT_ID repository secret to the Web OAuth client ID.');
              process.exit(1);
            }
            console.log('GoogleAuth clientId present, project prefix: ' + id.split('-')[0]);
          "

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesab-ketab-apk
          path: android/app/build/outputs/apk/debug/hesab-ketab.apk
